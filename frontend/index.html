<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MercuryMail</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-placeholder" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;box-sizing:border-box;">
        <div style="width:100%;max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12);">
          <h1 style="margin:0 0 12px;font-size:24px;">MercuryMail 正在启动</h1>
          <p style="margin:0;color:#475569;line-height:1.7;">正在加载前端资源。如果页面长时间停留在这里，请检查浏览器控制台或确认服务器静态资源是否全部可访问。</p>
        </div>
      </div>
    </div>
    <script>
      window.__MERCURY_BOOT_TIMER__ = window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.getAttribute('data-react-mounted') === 'true') return;
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;padding:24px;box-sizing:border-box;"><div style="width:100%;max-width:760px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12);"><h1 style="margin:0 0 12px;font-size:24px;">MercuryMail 前端未完成启动</h1><p style="margin:0 0 12px;color:#475569;line-height:1.7;">HTML 已加载，但 React 应用没有在预期时间内完成渲染。常见原因是主 JS 执行时报错、浏览器不支持当前语法、扩展拦截脚本，或 API 请求被网络策略阻止。</p><p style="margin:0;color:#475569;line-height:1.7;">请打开浏览器开发者工具 Console，查看第一条红色错误，并确认 Network 中 /assets/index-*.js 的状态为 200。</p></div></div>';
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
